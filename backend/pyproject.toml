[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["app*"]

[project]
name = "tradebridge"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
  "fastapi>=0.115",
  "uvicorn[standard]>=0.32",
  "pydantic>=2.9",
  "pydantic-settings>=2.6",
  "sqlalchemy[asyncio]>=2.0.36",
  "asyncpg>=0.30",
  "alembic>=1.14",
  "redis>=5.2",
  "arq>=0.26",
  "httpx>=0.27",
  "argon2-cffi>=23.1",
  "pyjwt>=2.10",
  "pyotp>=2.9",
  "structlog>=24.4",
  "sentry-sdk[fastapi]>=2.18",
  "prometheus-client>=0.21",
  "jinja2>=3.1",
  "python-multipart>=0.0.12",
  "email-validator>=2.2",
  "cryptography>=43.0",
]

[project.optional-dependencies]
dev = ["pytest>=8.3", "pytest-asyncio>=0.24", "ruff>=0.8", "mypy>=1.13",
       "respx>=0.21", "fakeredis>=2.26", "aiosqlite>=0.20"]

[tool.ruff]
line-length = 100
target-version = "py312"
[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "ASYNC", "S", "RUF"]
ignore = ["S101", "B008"]

[tool.ruff.lint.per-file-ignores]
# S105/S106 flag any literal near a "secret"-shaped name. These are field names and
# test fixtures, not credentials; real secrets are asserted absent by test_redaction.
"tests/**" = ["S105", "S106"]
"app/core/config.py" = ["S105"]
"app/api/v1/auth.py" = ["S105"]
"app/api/v1/members.py" = ["S106"]
"app/cli.py" = ["S106"]

[tool.mypy]
python_version = "3.12"
strict = true
plugins = []
ignore_missing_imports = true

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
