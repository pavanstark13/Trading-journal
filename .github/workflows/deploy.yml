name: Deploy

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment: production
    steps:
      - uses: actions/checkout@v4

      - name: Deploy over SSH
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.DEPLOY_HOST }}
          username: ${{ secrets.DEPLOY_USER }}
          key: ${{ secrets.DEPLOY_SSH_KEY }}
          script: |
            set -e
            cd /srv/app
            git fetch --tags
            git checkout ${{ github.ref_name }}
            docker compose -f infra/docker-compose.yml up -d --build
            # Migrations run in the backend entrypoint; wait for it to report healthy.
            for i in $(seq 1 30); do
              if curl -fsS http://localhost/api/v1/health > /dev/null; then
                echo "healthy"; exit 0
              fi
              sleep 5
            done
            echo "Health check never passed -- rolling back"
            git checkout -
            docker compose -f infra/docker-compose.yml up -d --build
            exit 1
